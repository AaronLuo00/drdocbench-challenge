<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synthetic Dr.DocBench scoring example</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e8ecef; color: #17233a; font-family: Georgia, serif; }
    main { width: 900px; min-height: 1200px; margin: 0 auto; padding: 92px 88px; background: #fff; }
    h1 { margin: 0 0 42px; font-size: 44px; border-bottom: 3px solid #1d7874; padding-bottom: 16px; }
    p { font-size: 25px; line-height: 1.55; }
    .formula { margin: 54px 0; text-align: center; font-size: 38px; font-style: italic; }
    table { width: 100%; margin-top: 48px; border-collapse: collapse; font-family: Arial, sans-serif; font-size: 22px; }
    th, td { border: 2px solid #425466; padding: 16px; text-align: left; }
    th { background: #eef5f3; }
  </style>
</head>
<body>
  <main>
    <h1>Energy Report</h1>
    <p>The model uses inline notation <em>x + 1</em>.</p>
    <div class="formula">E = mc<sup>2</sup></div>
    <table>
      <thead><tr><th>Year</th><th>Output</th></tr></thead>
      <tbody><tr><td>2025</td><td>125</td></tr></tbody>
    </table>
  </main>
</body>
</html>
